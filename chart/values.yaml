image:
  repository: ghcr.io/slux567/portfolio
  # Leave empty to use the chart's appVersion (set by the pipeline from the git tag).
  # Set it to a commit SHA to deploy a specific build instead.
  tag: ""

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

# How many proxies in front of the app add the visitor's IP to the
trustedProxyCount: 2

route:
  hostname: portfolio.sluxcloud.com
  gateway:
    name: external
    namespace: envoy-gateway
    sectionName: https
