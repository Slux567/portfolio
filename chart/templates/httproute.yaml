# The HTTPRoute tells the Gateway: send traffic for this hostname to our Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.hostname }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 80
