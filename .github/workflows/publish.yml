name: Publish

# Only runs when a version tag is pushed (e.g. v1.2.0):
# image tagged with the short commit SHA and 1.2.0, plus Helm chart 1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          VERSION=${GITHUB_REF_NAME#v}   # v1.2.0 -> 1.2.0
          docker build -t $IMAGE:$SHA -t $IMAGE:$VERSION .
          docker push $IMAGE:$SHA
          docker push $IMAGE:$VERSION

  chart:
    # Runs after the image exists
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and push chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          # The git tag sets both the chart version and the app (image) version
          helm package chart/ --version $VERSION --app-version $VERSION
          helm push portfolio-$VERSION.tgz oci://ghcr.io/$OWNER/charts
