{#
    This page "extends" base.html: it reuses the <head>, navigation and footer,
    and only fills in the "content" block.
    {{ ... }} prints a value, {% ... %} is logic like loops and ifs.

    Elements with the "reveal" class fade in when they scroll into view
    (see static/reveal.js and the <style> in base.html).
    style="--delay: ..." makes elements in a row appear one after another.
#}
{% extends "base.html" %}

{% block content %}

<!-- Intro: fills the whole screen and fades away while you scroll down -->
<section class="relative flex min-h-[calc(100svh-3rem)] flex-col items-center justify-center overflow-hidden px-6 text-center">
    <div class="hero-content flex flex-col items-center">
        <div class="reveal relative">
            <div class="hero-glow absolute -inset-24" aria-hidden="true"></div>
            <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Photo of {{ profile.name }}"
                 width="160" height="160"
                 class="relative h-36 w-36 rounded-full ring-1 ring-white/15 sm:h-40 sm:w-40">
        </div>

        <p class="reveal mt-10 text-lg font-medium text-neutral-400" style="--delay: 100ms">
            {{ profile.title }} &middot; {{ profile.location }}
        </p>
        <h1 class="reveal mt-3 bg-linear-to-b from-white to-neutral-400 bg-clip-text pb-2 text-6xl font-semibold tracking-tighter text-transparent sm:text-8xl"
            style="--delay: 200ms">
            {{ profile.name }}
        </h1>
        <p class="reveal mx-auto mt-8 max-w-2xl text-xl leading-relaxed text-neutral-400 sm:text-2xl" style="--delay: 300ms">
            {{ profile.bio }}
        </p>
    </div>

    <!-- Small hint that there's more below -->
    <a href="#skills" class="absolute bottom-10 text-neutral-500 transition hover:text-white" aria-label="Scroll to skills">
        <svg class="h-6 w-6 animate-bounce" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
        </svg>
    </a>
</section>

<!-- Skills -->
<section id="skills" class="mx-auto flex min-h-svh max-w-5xl flex-col justify-center px-6 py-32">
    <p class="reveal text-lg font-semibold text-blue-400">Skills</p>
    <h2 class="reveal mt-2 text-5xl font-semibold tracking-tighter text-white sm:text-7xl" style="--delay: 100ms">
        {{ profile.core_skills | join(". ") }}.
    </h2>
    <p class="reveal mt-6 max-w-2xl text-xl text-neutral-400" style="--delay: 200ms">
        The foundation. Plus everything it takes to build, run and observe a platform.
    </p>

    <ul class="mt-16 flex flex-wrap gap-3">
        {% for skill in profile.skills %}
            <li class="reveal rounded-full bg-neutral-900 px-5 py-2.5 text-sm text-neutral-300 ring-1 ring-white/10"
                style="--delay: {{ loop.index0 * 25 }}ms">
                {{ skill }}
            </li>
        {% endfor %}
    </ul>
</section>

<!-- Experience -->
<section id="experience" class="mx-auto flex min-h-svh max-w-5xl flex-col justify-center px-6 py-32">
    <p class="reveal text-lg font-semibold text-blue-400">Experience</p>
    <h2 class="reveal mt-2 text-5xl font-semibold tracking-tighter text-white sm:text-7xl" style="--delay: 100ms">
        Where I work(ed).
    </h2>

    <div class="mt-16 space-y-4">
        {% for job in profile.experience %}
            <div class="reveal flex flex-col gap-6 rounded-3xl bg-neutral-900 p-8 ring-1 ring-white/10 sm:flex-row sm:items-center sm:gap-8 sm:p-10"
                 style="--delay: {{ 200 + loop.index0 * 100 }}ms">
                {% if job.logo %}
                    <!-- brightness-0 invert turns every logo plain white, so they all fit the dark design -->
                    <div class="flex h-16 w-32 shrink-0 items-center sm:justify-center">
                        <img src="{{ url_for('static', filename='logos/' + job.logo) }}" alt="{{ job.company }} logo"
                             class="max-h-full max-w-full object-contain brightness-0 invert">
                    </div>
                {% endif %}
                <div>
                    <p class="text-sm text-neutral-500">{{ job.period }}</p>
                    <h3 class="mt-3 text-3xl font-semibold tracking-tight text-white">{{ job.role }}</h3>
                    <p class="mt-1 text-xl text-neutral-400">{{ job.company }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
</section>

<!-- Certificates (loaded from Credly in app.py) -->
<section id="certificates" class="mx-auto flex min-h-svh max-w-5xl flex-col justify-center px-6 py-32">
    <p class="reveal text-lg font-semibold text-blue-400">Certificates</p>
    <h2 class="reveal mt-2 text-5xl font-semibold tracking-tighter text-white sm:text-7xl" style="--delay: 100ms">
        Certified.
    </h2>
    {% if certificates %}
        <p class="reveal mt-6 text-xl text-neutral-400" style="--delay: 200ms">
            {{ certificates | length }} certifications, verified on Credly.
        </p>
    {% else %}
        <p class="reveal mt-6 text-xl text-neutral-400" style="--delay: 200ms">
            Could not load certificates right now.
        </p>
    {% endif %}

    {#
        batch(6) splits the list into groups of 6. Each group becomes one "page".
        Only the first page is visible; the others get the "hidden" class.
    #}
    <div class="reveal mt-16" style="--delay: 300ms">
        {% for group in certificates | batch(6) %}
            <div class="cert-page grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 {% if not loop.first %}hidden{% endif %}">
                {% for cert in group %}
                    <a href="{{ cert.url }}" target="_blank" rel="noopener"
                       class="group flex flex-col items-center rounded-3xl bg-neutral-900 p-8 text-center ring-1 ring-white/10 transition duration-500 hover:-translate-y-1 hover:ring-white/25">
                        <img src="{{ cert.image }}" alt="{{ cert.name }} badge" loading="lazy"
                             class="h-24 w-24 transition duration-500 group-hover:scale-105">
                        <h3 class="mt-6 font-semibold tracking-tight text-white">{{ cert.name }}</h3>
                        <p class="mt-1 text-sm text-neutral-400">{{ cert.issuer }}</p>
                        <p class="mt-1 text-sm text-neutral-500">{{ cert.date }}</p>
                    </a>
                {% endfor %}
            </div>
        {% endfor %}

        <!-- One button per page. Only shown when there is more than one page. -->
        {% set page_count = (certificates | batch(6) | list | length) %}
        {% if page_count > 1 %}
            <div class="mt-8 flex justify-center gap-2">
                {% for number in range(page_count) %}
                    <button type="button" data-page="{{ number }}"
                            aria-label="Show certificates page {{ number + 1 }}"
                            class="cert-button h-9 w-9 rounded-full text-sm transition {% if loop.first %}bg-white text-black{% else %}bg-neutral-800 text-neutral-300{% endif %}">
                        {{ number + 1 }}
                    </button>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</section>

<!-- The page buttons are handled in static/certificates.js -->
<script src="{{ url_for('static', filename='certificates.js') }}" defer></script>

<!-- Projects -->
<section id="projects" class="mx-auto flex min-h-svh max-w-5xl flex-col justify-center px-6 py-32">
    <p class="reveal text-lg font-semibold text-blue-400">Projects</p>
    <h2 class="reveal mt-2 text-5xl font-semibold tracking-tighter text-white sm:text-7xl" style="--delay: 100ms">
        Things I build.
    </h2>

    <div class="mt-16 space-y-4">
        {% for project in profile.projects %}
            <a href="{{ project.url }}" target="_blank" rel="noopener"
               class="reveal group block rounded-3xl bg-neutral-900 p-8 ring-1 ring-white/10 transition duration-500 hover:ring-white/25 sm:p-10"
               style="--delay: {{ 200 + loop.index0 * 100 }}ms">
                <h3 class="text-3xl font-semibold tracking-tight text-white">{{ project.name }}</h3>
                <p class="mt-3 max-w-2xl text-xl text-neutral-400">{{ project.description }}</p>
                <p class="mt-6 text-blue-400">
                    View on GitHub
                    <span class="inline-block transition duration-300 group-hover:translate-x-1" aria-hidden="true">&rarr;</span>
                </p>
            </a>
        {% endfor %}
    </div>
</section>

<!-- Contact -->
<section id="contact" class="flex min-h-svh flex-col items-center justify-center px-6 py-32 text-center">
    <h2 class="reveal bg-linear-to-b from-white to-neutral-400 bg-clip-text pb-2 text-6xl font-semibold tracking-tighter text-transparent sm:text-8xl">
        Let's talk.
    </h2>
    <p class="reveal mt-6 text-xl text-neutral-400" style="--delay: 100ms">
        Want to get in touch? I'd love to hear from you.
    </p>
    <a href="mailto:{{ profile.email }}"
       class="reveal mt-10 rounded-full bg-blue-500 px-8 py-3.5 text-lg font-medium text-white transition hover:bg-blue-400"
       style="--delay: 200ms">
        {{ profile.email }}
    </a>
</section>

{% endblock %}
