<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}{{ profile.name }} | {{ profile.title }}{% endblock %}</title>
    <meta name="description" content="{{ profile.name }} - {{ profile.title }} from {{ profile.location }}, focused on Kubernetes and cloud-native platforms.">

    <!--
        TailwindCSS loaded from a CDN: no Node.js or build step needed.
        You can use any Tailwind class directly in the HTML.
        The integrity hash makes the browser refuse the file if it was tampered with.
        Docs: https://tailwindcss.com/docs
    -->
    <script src="{{ tailwind_url }}"
            integrity="sha384-t+qLIxS5zM/KF99/doWY+dxTsavdvgayaZt8A9ntLsUjEkiXzYl5M3Ij8zVFPL9j"
            crossorigin="anonymous"></script>

    <!--
        Scroll animations. Loaded in the <head> (without "defer") so it can hide
        the animated elements before the page is drawn, which prevents a flicker.
    -->
    <script src="{{ url_for('static', filename='reveal.js') }}"></script>

    <!--
        A few styles that are easier to write as plain CSS than as Tailwind classes.
        Inline <style> is allowed by the Content-Security-Policy in app.py.
    -->
    <style>
        /* Apple's own font on Apple devices, a clean system font everywhere else. */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        }

        /* Leave room for the sticky navigation bar when jumping to a section. */
        section[id] {
            scroll-margin-top: 3rem;
        }

        /* Soft blue glow behind the profile picture. */
        .hero-glow {
            background: radial-gradient(circle at center, rgb(41 151 255 / 0.25), transparent 60%);
        }

        /* All animations only run when the visitor hasn't asked their OS for reduced motion. */
        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }

            /*
                Fade in on scroll: reveal.js adds the "js" class to <html>, then adds
                "is-visible" to each .reveal element once it scrolls into view.
                Without JavaScript the "js" class is missing, so everything stays visible.
                --delay lets elements in a row appear one after another.
            */
            .js .reveal {
                opacity: 0;
                transform: translateY(40px);
                transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
                            transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
                transition-delay: var(--delay, 0ms);
            }
            .js .reveal.is-visible {
                opacity: 1;
                transform: none;
            }

            /*
                The intro fades and shrinks away as you scroll down, linked directly to
                the scroll position. Browsers that don't support this (yet) just skip it.
            */
            @supports (animation-timeline: scroll()) {
                .hero-content {
                    animation: hero-out linear both;
                    animation-timeline: scroll();
                    animation-range: 0 80vh;
                }
                @keyframes hero-out {
                    to {
                        opacity: 0;
                        transform: scale(0.9) translateY(-60px);
                        filter: blur(6px);
                    }
                }
            }
        }
    </style>
</head>
<body class="bg-black text-neutral-200 antialiased selection:bg-blue-500/40">
    <!-- Navigation bar: stays at the top and blurs the page behind it. -->
    <nav class="sticky top-0 z-50 border-b border-white/10 bg-black/70 backdrop-blur-xl backdrop-saturate-150">
        <div class="mx-auto flex h-12 max-w-5xl items-center justify-between px-6 text-xs">
            <a href="#top" class="font-semibold tracking-tight text-white">{{ profile.name }}</a>
            <div class="flex gap-6 text-neutral-400">
                <a href="#skills" class="hidden transition hover:text-white sm:inline">Skills</a>
                <a href="#experience" class="hidden transition hover:text-white sm:inline">Experience</a>
                <a href="#certificates" class="hidden transition hover:text-white sm:inline">Certificates</a>
                <a href="#projects" class="hidden transition hover:text-white sm:inline">Projects</a>
                <a href="#contact" class="transition hover:text-white">Contact</a>
            </div>
        </div>
    </nav>

    <main id="top">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-white/10 py-10 text-center text-xs text-neutral-500">
        &copy; {{ profile.name }}
    </footer>
</body>
</html>
